---
- hosts: all
  become: true
  pre_tasks:

  - name: Install updates for Fedora
    tags: always
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install packages for Fedora
    tags: always
    ansible.builtin.dnf:
      name:
        - fastfetch
      state: latest
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install updates for Debian
    tags: always
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
    when: ansible_facts['os_family'] == "Debian"

  - name: Install packages for Debian
    tags: always
    ansible.builtin.apt:
      name:
        - fastfetch
      state: latest
    when: ansible_facts['os_family'] == "Debian"

